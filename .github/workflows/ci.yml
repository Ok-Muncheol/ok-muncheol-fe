name: Frontend CI
# feature → main PR을 검증한다. check·gitleaks는 main 브랜치 보호의 필수 체크다.
# check의 명령과 순서는 automation/ship.md Phase 2(로컬 선검증)와 같아야 한다 — 바꾸면 둘을 함께 고친다.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# 같은 PR에 새 push가 오면 이전 런을 취소한다. main push 런은 진행 중이어도 취소하지 않는다 —
# 머지 커밋마다 런이 끝까지 남아야 그 커밋의 검증 기록이 된다 (automation/pipeline.md Step 2)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # automation/bin 게이트·폴링 스크립트 회귀 검증 (판정 fixture + fail-closed 성질 + 민감 파일 훅)
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # 커밋 이력에 API 키 등 시크릿이 섞이지 않았는지 검사한다
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks scan
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source=. --redact -v
